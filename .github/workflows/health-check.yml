# 书源健康巡检: 从 GitHub Actions (墙外) 对生产 Worker 做冒烟测试
# 触发: worker.js 变更的 push / 手动 / 每日定时(北京时间 06:00)
name: book-source-health-check
on:
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/health-check.yml']
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Production worker search smoke test
        run: |
          set -e
          FAIL=0
          for Q in "pride and prejudice" "三体" "论语"; do
            echo "===== query: $Q ====="
            curl -sS --max-time 120 -G "https://book-finder-api.3280244146.workers.dev/api/search" \
              --data-urlencode "q=$Q" -o resp.json || { echo "worker unreachable"; FAIL=1; continue; }
            node -e '
              const d = require("./resp.json");
              if (!d.results) { console.log("BAD RESPONSE:", JSON.stringify(d).slice(0, 300)); process.exit(1); }
              let withHits = 0;
              for (const s of d.results) {
                const n = (s.items || []).length;
                if (s.ok && n > 0) withHits++;
                console.log((s.ok ? "PASS" : "FAIL"), s.name, n + "条", s.error || "");
              }
              console.log("sources with hits:", withHits + "/" + d.results.length);
              if (withHits < 2) { console.log("TOO FEW SOURCES RETURNED RESULTS"); process.exit(1); }
            ' || FAIL=1
          done
          echo "===== novel search smoke: 斗破苍穹 (non-blocking) ====="
          if ! curl -sS --max-time 60 -G "https://book-finder-api.3280244146.workers.dev/api/novel/search" \
            --data-urlencode "q=斗破苍穹" -o resp.json; then
            echo "::warning::novel search endpoint unreachable; continuing without blocking the build"
          else
            node -e '
            const d = require("./resp.json");
            const ok = (d.sources || []).filter(s => s.ok && s.items.length > 0);
            (d.sources || []).forEach(s => console.log((s.ok ? "PASS" : "FAIL"), s.name, (s.items || []).length + "条", s.error || ""));
            console.log("novel sources with hits:", ok.length + "/" + (d.sources || []).length);
            if (ok.length < 1) console.log("::warning::NO NOVEL SOURCE RETURNED RESULTS; novel search is degraded but the overall health check remains non-blocking");
            ' || echo "::warning::novel search response could not be parsed; continuing without blocking the build"
          fi
          exit $FAIL
